version: 2

updates:
  # NuGet: alle Versionen stehen zentral in Directory.Packages.props, Dependabot
  # aktualisiert sie dort. Verzeichnis "/" reicht — CPM macht die csproj versionsfrei.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      # Avalonia MUSS über alle Heads auf derselben Linie bleiben — einzelne PRs pro
      # Paket würden die Heads auseinanderziehen und den nativen Skia-Abgleich brechen.
      avalonia:
        patterns:
          - "Avalonia*"
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore*"
      tests:
        patterns:
          - "xunit*"
          - "Microsoft.AspNetCore.Mvc.Testing"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/server/FlexFamilyCalendar.Api"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
