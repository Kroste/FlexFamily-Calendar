name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manuell startbar, auch gegen einen anderen Branch (`gh workflow run CI --ref <branch>`).
  # Gedacht für Gegenproben: neuen Test gegen den alten Stand laufen lassen, ohne main rot
  # zu machen — vor allem für Fehler, die nur auf einem Runner-OS auftreten.
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer braucht die volle Historie, um Tags zu finden.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # Spart pro Lauf die komplette Restore-Zeit. Der Cache-Key hängt an den
          # Lock-/Projektdateien, mit CPM also an Directory.Packages.props.
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # Browser-Head braucht die wasm-tools-Workload; ohne kann `dotnet restore` das
      # Browser-Projekt nicht auflösen (NETSDK1147).
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Tests laufen auf xunit.v3 / Microsoft.Testing.Platform (Opt-in in der global.json).
      # Keine VSTest-Flags anhängen — die reicht `dotnet test` an die Test-Exe durch, die
      # sie nicht kennt, und der Lauf endet mit "Es wurden keine Tests ausgeführt".
      - name: Build & Test (Solution)
        # --solution statt positionalem Pfad: mit MTP-Runner (global.json) bricht ältere SDKs
        # (z.B. das Fedora-RPM 10.0.111) die positionale Form mit Exitcode 1 ab; --solution
        # läuft auf allen.
        run: dotnet test --solution FlexFamilyCalendar.slnx -c Release --verbosity normal

  # Der Single-Instance-Wächter verhält sich unter Windows grundlegend anders als unter Linux:
  # dort sind Named Pipes echte Kernel-Objekte, hier bildet .NET sie auf Unix-Sockets ab.
  single-instance-windows:
    name: Single-Instance (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Wächter-Tests
        run: dotnet test --project tests/FlexFamilyCalendar.Tests/FlexFamilyCalendar.Tests.csproj -c Release --filter-query "/*/*/SingleInstanceGuardTests/*"
